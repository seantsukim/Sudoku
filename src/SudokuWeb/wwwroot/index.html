<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sudoku</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- YouTube player pinned to the top-right corner.
         Type in the search bar; matching videos appear as you type (searched on the server).
         Pick one with a click or the arrow keys + Enter, and it plays in the embedded player.
         The "–" button hides the player without stopping the video. -->
    <aside id="video-panel" class="video-panel" aria-label="YouTube player">
        <div class="video-header">
            <span>YouTube</span>
            <button id="video-toggle" type="button" class="icon-button"
                    aria-expanded="true" aria-controls="video-body" title="Hide player">&ndash;</button>
        </div>
        <div id="video-body" class="video-body">
            <!-- Search bar + dropdown list of results (a "combobox" for screen readers) -->
            <div class="video-search">
                <input id="video-search" type="search" placeholder="Search videos (e.g. lofi, queen, 80s)"
                       role="combobox" aria-label="Search videos" aria-autocomplete="list"
                       aria-expanded="false" aria-controls="video-results" autocomplete="off" />
                <ul id="video-results" class="video-results" role="listbox" aria-label="Search results" hidden></ul>
            </div>
            <!-- video.js puts the YouTube <iframe> in here -->
            <div id="video-frame" class="video-frame">
                <p class="video-hint">Search for a video above to play it while you solve.</p>
            </div>
            <p id="video-status" class="video-status" role="status" aria-live="polite"></p>
        </div>
    </aside>

    <main class="app">
        <h1>Sudoku</h1>
        <p class="subtitle">Fill every row, column and 3x3 box with the numbers 1&ndash;9.</p>

        <!-- Game controls: pick a difficulty and start a new random board -->
        <section class="controls">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
            <button id="new-game" type="button">New Game</button>
        </section>

        <!-- The 9x9 board. app.js fills this table with 81 cells;
             starting numbers are fixed, empty cells become 1-9 dropdowns. -->
        <table id="board" class="board" aria-label="Sudoku board"></table>

        <!-- Answer actions -->
        <section class="controls">
            <button id="check" type="button" class="primary">Check Answer</button>
            <button id="clear" type="button">Clear My Entries</button>
        </section>

        <!-- Result of "Check Answer" or any error message -->
        <p id="message" class="message" role="status" aria-live="polite"></p>
    </main>

    <script src="app.js"></script>
    <script src="video.js"></script>
</body>
</html>
